name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc clang

      - name: Build and Test with GCC
        run: |
          make clean
          make all CC=gcc
          make test
          test -f snapshots.txt
          make tree
          make stress

      - name: Build and Test with Clang
        run: |
          make clean
          make all CC=clang
          make test
          make tree
          make stress
